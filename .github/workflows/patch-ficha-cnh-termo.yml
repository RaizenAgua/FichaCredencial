name: Ajuste pontual da ficha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ficha-cnh-termo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar os dois ajustes solicitados
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              (
                  '<section><h2>5. CNH / Operador de veículos ou equipamentos de rampa</h2>',
                  '<section id="sec-cnh" class="hidden"><h2>5. CNH / Operador de veículos ou equipamentos de rampa</h2>'
              ),
              (
                  '<div><label class="required" for="arquivo_termo">Termo de ciência assinado</label><input id="arquivo_termo" name="arquivo_termo" type="file" accept=".pdf,application/pdf"><p class="help">Termo digitalizado em PDF e assinado com assinatura idêntica ao documento enviado. Tamanho máximo recomendado: 4 MB.</p></div>',
                  '<div><label for="arquivo_termo">Termo de ciência assinado</label><input id="arquivo_termo" name="arquivo_termo" type="file" accept=".pdf,application/pdf"><p class="help">Opcional para gerar o JSON. Se já tiver o termo, pode anexá-lo em PDF; caso contrário, envie-o separadamente quando estiver disponível. Tamanho máximo recomendado: 4 MB.</p></div>'
              ),
              (
                  'Essa opção ainda exige que todos os documentos sejam selecionados para conferência, mas gera um arquivo menor, contendo apenas a lista dos anexos.',
                  'Essa opção ainda exige que todos os documentos obrigatórios da ficha sejam selecionados para conferência, mas gera um arquivo menor, contendo apenas a lista dos anexos.'
              ),
              (
                  'function atualizarTipo(){const tipo=document.getElementById("tipo_credencial").value;document.getElementById("sec-permanente").classList.toggle("hidden",tipo!=="Permanente");document.getElementById("sec-anexos-permanente").classList.toggle("hidden",tipo!=="Permanente")}',
                  'function atualizarTipo(){const tipo=document.getElementById("tipo_credencial").value;const permanente=tipo==="Permanente";document.getElementById("sec-permanente").classList.toggle("hidden",!permanente);document.getElementById("sec-cnh").classList.toggle("hidden",!permanente);document.getElementById("sec-anexos-permanente").classList.toggle("hidden",!permanente)}'
              ),
              (
                  'if(!document.getElementById("arquivo_termo").files.length)erros.push("Termo de ciência assinado");',
                  ''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado: {old[:120]}')
              text = text.replace(old, new, 1)

          if text == original:
              raise SystemExit('Nenhuma alteração foi aplicada.')

          # Verificações finais dos dois comportamentos.
          assert 'id="sec-cnh" class="hidden"' in text
          assert 'document.getElementById("sec-cnh").classList.toggle("hidden",!permanente)' in text
          assert 'if(!document.getElementById("arquivo_termo").files.length)erros.push("Termo de ciência assinado");' not in text
          assert '<label for="arquivo_termo">Termo de ciência assinado</label>' in text

          path.write_text(text, encoding='utf-8')

      - name: Commit da atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajusta CNH temporária e termo opcional no JSON"
          git push
